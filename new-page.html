<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت و دستیار هوشمند - موسسه دادمان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; min-height: 100vh; }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(-45deg, #f1f5f9, #e2e8f0, #dcfce7, #f3f4f6);
            background-size: 400% 400%; animation: globalGradientBG 15s ease infinite; opacity: 0.8;
        }
        .dark body::before, html.dark body::before {
            background: linear-gradient(-45deg, #064e3b, #022c22, #0f172a, #1e293b) !important; opacity: 1;
        }
        @keyframes globalGradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-transparent text-slate-700 dark:text-slate-100 flex flex-col min-h-screen">

    <!-- هدر -->
    <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 bg-emerald-700 text-white rounded-full overflow-hidden flex items-center justify-center border-2 border-emerald-500">
                    <img src="logo.jpg" alt="لوگو" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                </div>
                <div>
                    <h1 class="font-extrabold text-xl text-slate-900 dark:text-white">پنل مدیریت هوش مصنوعی دادمان</h1>
                    <span class="text-xs text-emerald-700 dark:text-emerald-400 font-medium">ویرایش و تغییر صفحات سایت</span>
                </div>
            </div>
            
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-emerald-400 flex items-center justify-center border border-slate-200 dark:border-slate-700">
                <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 my-auto flex flex-col justify-center">

        <!-- بخش اول: فرم ورود (کارت لاگین) -->
        <div id="loginSection" class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 max-w-md w-full mx-auto">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-emerald-700/10 text-emerald-700 dark:text-emerald-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">ورود مدیر سیستم</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">جهت دسترسی به دستیار هوشمند و تغییر صفحات وارد شوید</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">نام کاربری</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="username" required placeholder="نام کاربری..." class="w-full pr-10 pl-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">رمز عبور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400"><i class="fa-solid fa-key"></i></span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full pr-10 pl-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                </div>

                <div id="loginError" class="text-red-500 text-xs hidden text-center font-bold">نام کاربری یا رمز عبور اشتباه است!</div>

                <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>ورود به پنل ویرایش</span>
                </button>
            </form>
            
            <div class="mt-4 text-center">
                <span class="text-[11px] text-slate-400">(weel come ali )</span>
            </div>
        </div>

        <!-- بخش دوم: پنل مدیریت هوش مصنوعی (پس از ورود) -->
        <div id="adminPanel" class="hidden bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 w-full space-y-6">
            
            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-emerald-700 text-white rounded-xl flex items-center justify-center text-lg">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-900 dark:text-white">دستیار هوش مصنوعی ویرایشگر سایت</h3>
                        <p class="text-xs text-emerald-600 dark:text-emerald-400">وضعیت: متصل به سرور و فایل‌های سایت</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-xs bg-red-50 text-red-600 hover:bg-red-100 dark:bg-red-950/40 dark:text-red-400 px-3 py-2 rounded-xl transition">
                    خروج <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i>
                </button>
            </div>

            <!-- فرم تغییرات توسط هوش مصنوعی -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">کدام صفحه را می‌خواهید تغییر دهید؟</label>
                    <select id="targetPage" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                        <option value="index.html">صفحه اصلی (index.html)</option>
                        <option value="students.html">دانش‌آموزان DTS (students.html)</option>
                        <option value="teaching-method.html">نحوه تدریس (teaching-method.html)</option>
                        <option value="books.html">کتاب‌ها (books.html)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">دستور به هوش مصنوعی (تغییری که می‌خواهید اعمال شود):</label>
                    <textarea id="aiPrompt" rows="4" placeholder="مثال: متون بخش درباره ما را تغییر بده، رنگ دکمه ثبت نام را قرمز کن، یا یک فرم جدید اضافه کن..." class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-600"></textarea>
                </div>

                <button onclick="applyAICanges()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>اعمال تغییرات توسط هوش مصنوعی</span>
                </button>
            </div>

            <!-- باکس وضعیت و نتیجه -->
            <div id="statusBox" class="hidden p-4 rounded-xl text-xs leading-relaxed border"></div>

        </div>

    </main>

    <script>
        // مدیریت تم شب و روز
        const themeIcon = document.getElementById('themeIcon');
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeIcon.className = "fa-solid fa-sun text-lg";
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.className = "fa-solid fa-moon text-lg";
            }
        }
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                themeIcon.className = "fa-solid fa-moon text-lg";
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                themeIcon.className = "fa-solid fa-sun text-lg";
            }
        }
        initTheme();

        // مدیریت ورود با ali / ali
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const loginError = document.getElementById('loginError');

            if (user === 'ali' && pass === 'ali') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loginError.classList.add('hidden');
            } else {
                loginError.classList.remove('hidden');
            }
        }

        function logout() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        // اعمال تغییرات هوش مصنوعی
        function applyAICanges() {
            const page = document.getElementById('targetPage').value;
            const prompt = document.getElementById('aiPrompt').value;
            const statusBox = document.getElementById('statusBox');

            if (!prompt.trim()) {
                alert("لطفاً دستور تغییرات را وارد کنید.");
                return;
            }

            statusBox.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
            statusBox.classList.add('bg-amber-50', 'text-amber-800', 'border-amber-200');
            statusBox.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> در حال تحلیل فایل ${page} و اعمال دستورات توسط هوش مصنوعی...`;

            setTimeout(() => {
                statusBox.classList.remove('bg-amber-50', 'text-amber-800', 'border-amber-200');
                statusBox.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
                statusBox.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> **تغییرات با موفقیت در فایل ${page} اعمال شد!**<br>دستور اجرا شده: "${prompt}"`;
            }, 2000);
        }
    </script>
</body>
</html>
