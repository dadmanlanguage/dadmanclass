<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل دانش‌آموز | موسسه دادمان</title>
<style>
  :root{ --bg:#0f1115; --card:#171a21; --border:#262b35; --text:#e7e9ee; --muted:#9aa2b1; --accent:#3d7dfc; --danger:#e5484d; --radius:14px; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"Vazirmatn","Tahoma",sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:32px 28px; }
  h1{ font-size:1.3rem; margin:0 0 6px; }
  p.sub{ color:var(--muted); margin:0 0 24px; font-size:0.9rem; }
  label{ display:block; font-size:0.85rem; color:var(--muted); margin-bottom:6px; }
  input{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:#0c0e13; color:var(--text); font-size:1rem; margin-bottom:16px; font-family:inherit; }
  input:focus{ outline:none; border-color:var(--accent); }
  button{ width:100%; padding:12px 14px; border-radius:10px; border:none; background:var(--accent); color:white; font-size:1rem; cursor:pointer; font-family:inherit; }
  button:disabled{ opacity:0.6; cursor:default; }
  .error{ color:var(--danger); font-size:0.85rem; margin:-8px 0 16px; display:none; }
  .panel{ display:none; }
  .welcome{ font-size:1.1rem; margin-bottom:20px; }
  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab{ flex:1; padding:10px; text-align:center; border-radius:10px; border:1px solid var(--border); background:#0c0e13; cursor:pointer; color:var(--muted); font-size:0.9rem; }
  .tab.active{ background:var(--accent); color:white; border-color:var(--accent); }
  .section{ display:none; }
  .section.active{ display:block; }
  .item{ background:#0c0e13; border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .empty{ color:var(--muted); text-align:center; padding:30px 0; font-size:0.9rem; }
  .score{ background:var(--accent); color:white; padding:4px 12px; border-radius:20px; font-size:0.85rem; }
  audio{ width:100%; margin-top:8px; }
  .voice-item{ display:block; }
  .loading{ text-align:center; color:var(--muted); padding:20px; font-size:0.9rem; }
</style>
</head>
<body>

<div class="card">
  <div id="loginBox">
    <h1>پنل دانش‌آموز</h1>
    <p class="sub">موسسه دادمان</p>
    <label>نام کاربری</label>
    <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید">
    <label>رمز عبور (کد ملی)</label>
    <input type="password" id="password" placeholder="کد ملی خود را وارد کنید">
    <div class="error" id="loginError">نام کاربری یا رمز عبور اشتباه است.</div>
    <button id="loginBtn" onclick="doLogin()">ورود</button>
  </div>

  <div class="panel" id="panel">
    <div class="welcome" id="welcomeText"></div>
    <div class="tabs">
      <div class="tab active" data-tab="grades" onclick="switchTab('grades')">نمرات</div>
      <div class="tab" data-tab="voices" onclick="switchTab('voices')">فایل‌های صوتی</div>
    </div>
    <div class="section active" id="section-grades">
      <div id="gradesList"><div class="loading">در حال بارگذاری...</div></div>
    </div>
    <div class="section" id="section-voices">
      <div id="voicesList"><div class="loading">در حال بارگذاری...</div></div>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  owner: "dadmanlanguage",
  repo: "dadmat-data",
  dataPath: "students.json"
};

const RAW_BASE = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/main`;

// تابع تبدیل متن به SHA-256
async function hashString(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function normalizeDigits(str){
  const persian = "۰۱۲۳۴۵۶۷۸۹", arabic = "٠١٢٣٤٥٦٧٨٩";
  return String(str).replace(/[۰-۹٠-٩]/g, ch => {
    const pIdx = persian.indexOf(ch), aIdx = arabic.indexOf(ch);
    return pIdx > -1 ? pIdx : (aIdx > -1 ? aIdx : ch);
  });
}

async function doLogin(){
  const username = document.getElementById("username").value.trim();
  const password = normalizeDigits(document.getElementById("password").value.trim());
  const btn = document.getElementById("loginBtn");
  const errBox = document.getElementById("loginError");
  errBox.style.display = "none";

  if(!username || !password){
    errBox.textContent = "لطفاً نام کاربری و کد ملی را وارد کنید.";
    errBox.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "در حال بررسی...";

  try{
    const res = await fetch(`${RAW_BASE}/${CONFIG.dataPath}?t=${Date.now()}`);
    if(!res.ok) throw new Error("خطا در دریافت اطلاعات");
    
    const json = await res.json();
    const student = json[username];
    
    // هش کردن کد ملی وارد شده توسط کاربر
    const inputHash = await hashString(password);

    // مقایسه هش ورودی با هش موجود در JSON
    if(!student || student.nationalCodeHash !== inputHash){
      errBox.textContent = "نام کاربری یا رمز عبور اشتباه است.";
      errBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "ورود";
      return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").style.display = "block";
    document.getElementById("welcomeText").textContent = `سلام ${student.name || ""} 👋`;
    renderGrades(student.grades || []);
    renderVoices(student.voices || []);

  }catch(e){
    errBox.textContent = "خطا در برقراری ارتباط.";
    errBox.style.display = "block";
    btn.disabled = false;
    btn.textContent = "ورود";
  }
}

function switchTab(tab){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  document.getElementById("section-grades").classList.toggle("active", tab === "grades");
  document.getElementById("section-voices").classList.toggle("active", tab === "voices");
}

function renderGrades(grades){
  const box = document.getElementById("gradesList");
  if(!grades.length){ box.innerHTML = `<div class="empty">هنوز نمره‌ای ثبت نشده است.</div>`; return; }
  box.innerHTML = grades.map(g => `<div class="item"><span>${escapeHtml(g.title || "")}</span><span class="score">${escapeHtml(String(g.score ?? ""))}</span></div>`).join("");
}

function renderVoices(voices){
  const box = document.getElementById("voicesList");
  if(!voices.length){ box.innerHTML = `<div class="empty">هنوز فایل صوتی‌ای اضافه نشده است.</div>`; return; }
  box.innerHTML = voices.map((v,i) => `<div class="item voice-item"><div>${escapeHtml(v.name || "بدون عنوان")}</div><audio controls id="audio-${i}" preload="none"></audio></div>`).join("");

  voices.forEach((v, i) => {
    const audioEl = document.getElementById(`audio-${i}`);
    audioEl.addEventListener("play", function(){
      if(audioEl.dataset.loaded) return;
      const cleanPath = v.path.replace(/^\/+/, '');
      audioEl.src = `${RAW_BASE}/${cleanPath}`;
      audioEl.dataset.loaded = "1";
    });
  });
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
